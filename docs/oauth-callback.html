<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth callback — videoMaker</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; }
  code { background: #f0f0f0; padding: 12px; display: block; word-break: break-all; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
  <h1>OAuth callback</h1>
  <p id="status">Reading response…</p>
  <div id="result"></div>
  <script>
    // Static receiver page: TikTok's redirect_uri must be an HTTPS URL on a
    // verified domain, so this page just displays the returned `code` for
    // manual copy-paste into the local token-exchange script (the actual
    // exchange needs the client secret, which never belongs in a page
    // served to a browser).
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    var error = params.get("error");
    var errorDescription = params.get("error_description");
    var statusEl = document.getElementById("status");
    var resultEl = document.getElementById("result");

    if (error) {
      statusEl.textContent = "OAuth error:";
      resultEl.innerHTML = "<code>" + error + (errorDescription ? " — " + errorDescription : "") + "</code>";
    } else if (code) {
      statusEl.textContent = "Copy this code and paste it into the local bootstrap script's prompt:";
      resultEl.innerHTML = "<code>" + code + "</code>";
    } else {
      statusEl.textContent = "No code or error param found in the URL.";
    }
  </script>
</body>
</html>
