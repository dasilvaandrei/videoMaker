name: Cleanup published storage

# Self-heal against the project running out of Supabase storage/egress
# quota (see the 2026-09-30 incident, where exceed_storage_size_quota +
# exceed_egress_quota restricted the whole project and silently stopped
# every publish job). Started weekly on the assumption that a slow
# trickle of finished videos wouldn't fill storage in a few days — wrong:
# it refilled past quota and re-triggered the same lockout just 2 days
# after a full cleanup (2026-10-03), this time hard enough to block even
# read access. Daily now, and cleanup-published-storage.ts no longer
# waits on Instagram's slower backlog to call a video "done" (see its
# CLEANUP_GATING_PLATFORMS comment), so there's much more to reclaim.
on:
  schedule:
    - cron: "0 9 * * *" # Daily, 9:00 AM UTC
  workflow_dispatch: {} # manual trigger, e.g. right after a quota incident

jobs:
  cleanup-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # worker/package.json's job scripts all pass Node's --env-file=../.env
      # — see daily-pipeline.yml's comment for why this needs to exist
      # (not be populated) even in CI, where real values come from the
      # env: block below.
      - name: Create empty .env for --env-file
        run: touch .env

      - name: Clean up fully-published storage
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run cleanup-published-storage
