name: Cleanup published storage

# Backstop for Supabase storage. The main cleanup now runs at the end of
# every daily-pipeline run, deleting each video as soon as it's on
# YouTube (see cleanup-published-storage.ts). This daily run catches
# anything that slipped through: a pipeline run that crashed before
# reaching cleanup, or orphaned files from failed renders. Storage
# quota overruns restricted and then took down the whole project in
# Sept/Oct 2026, stopping every publish job.
on:
  schedule:
    - cron: "0 9 * * *" # Daily, 9:00 AM UTC
  workflow_dispatch: {} # manual trigger, e.g. right after a quota incident

jobs:
  cleanup-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # worker/package.json's job scripts all pass Node's --env-file=../.env
      # — see daily-pipeline.yml's comment for why this needs to exist
      # (not be populated) even in CI, where real values come from the
      # env: block below.
      - name: Create empty .env for --env-file
        run: touch .env

      - name: Clean up fully-published storage
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run cleanup-published-storage
